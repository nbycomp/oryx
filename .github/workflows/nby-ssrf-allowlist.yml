# Guards the SSRF allowlist patch (ipx/ssrf_nby.go) across rebases onto upstream.
name: nby-ssrf-allowlist

on:
  push:
    branches: ["nby/**"]
  pull_request:
    branches: ["nby/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./ipx/
